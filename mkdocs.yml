site_name: chaos-toolbox
site_description: >-
  stress-ng and tc/netem chaos experiments in one small image — every
  experiment needs a duration, and every network rule is removed on exit.
repo_url: https://github.com/fabiocicerchia/chaos-toolbox
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

nav:
  - Home: README.md
  - Architecture: architecture.md
  - Getting Started: getting-started.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
